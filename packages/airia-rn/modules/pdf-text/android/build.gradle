apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.pdftext'
version = '0.1.0'

android {
  namespace 'expo.modules.pdftext'
  compileSdk safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '2.0.21')}"

  // Android has no built-in PDF text extraction — PdfRenderer only rasterises
  // pages. PdfBox-Android is the Android port of Apache PDFBox.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
